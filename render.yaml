services:
  - type: web
    name: retailza-api
    runtime: python
    plan: free
    region: singapore # Closest low-latency region to India
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_NAME
        value: Retailza
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # JWT signing key: set a strong random value in the Render dashboard.
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: DEBUG_MOCK_OTP
        value: "false"
      - key: MOCK_OTP_CODE
        value: "123456"
      - key: SMS_PROVIDER
        value: fast2sms
      - key: FAST2SMS_API_KEY
        value: hXIfLmtDixvHZy1VnkFojqzBs0Ju3EKe6MAG9QgcCTlr7ap4wdpG2QYqSEsaCzPojAei06hb34fNgKdl
      # UPI Gateway subscription payments: set values in the Render dashboard.
      - key: UPI_GATEWAY_BASE_URL
        sync: false
      - key: UPI_GATEWAY_API_KEY
        sync: false
      - key: UPI_GATEWAY_API_SECRET
        sync: false
      - key: UPI_GATEWAY_WEBHOOK_SECRET
        sync: false
      - key: SUBSCRIPTION_AMOUNT
        value: "49.00"
      # Server-side paywall: turn on only after the UPI gateway is live.
      - key: ENFORCE_SUBSCRIPTION
        value: "false"
      # Allowed browser origins for CORS (comma-separated, or * ). Mobile app is unaffected.
      - key: ALLOWED_ORIGINS
        value: "*"
      # One-time super-admin seed: set these in the Render dashboard, then you may
      # clear SEED_ADMIN_PASSWORD. An existing admin is never overwritten.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_MOBILE
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
